name: seeplusplus
services:
  runner-image-builder:
    image: seeplusplus-runner:local
    build:
      context: .
      dockerfile: runner/local/Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: seeplusplus
      POSTGRES_PASSWORD: seeplusplus
      POSTGRES_DB: seeplusplus
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeplusplus"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: seeplusplus
      MINIO_ROOT_PASSWORD: seeplusplus-local-only
    volumes: ["minio-data:/data"]
    ports: ["9000:9000", "9001:9001"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:4000
      EXEC_MODE: docker
      RUNNER_IMAGE: seeplusplus-runner:local
      RUNNER_TIMEOUT_MS: 10000
      RUNNER_MEMORY_MB: 512
      RUNNER_MAX_STEPS: 1000
      RUNNER_MAX_OUTPUT_BYTES: 65536
      RUNNER_MAX_SOURCE_BYTES: 65536
      RUNNER_CONCURRENCY: 2
      DATABASE_URL: postgresql://seeplusplus:seeplusplus@postgres:5432/seeplusplus
      TRACE_CACHE_DIR: /data/traces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trace-cache:/data/traces
    group_add: ["0"]
    depends_on:
      runner-image-builder: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    ports: ["3000:3000"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { VITE_API_URL: "/v1", VITE_DEMO_MODE: "false" }
    depends_on: [api]
    ports: ["4000:4000"]

volumes:
  postgres-data:
  minio-data:
  trace-cache:
